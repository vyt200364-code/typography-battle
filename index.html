<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typography Battle</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="game">

    <h1>⚔️ TYPOGRAPHY BATTLE ⚔️</h1>

    <div id="playerNameBox">
        <input id="playerName" placeholder="Nhập tên chiến binh">
        <button onclick="startGame()">Bắt đầu</button>
    </div>


    <div id="battle" class="hidden">

        <div class="characters">

            <div class="hero">
                <h3 id="nameDisplay"></h3>

                <img src="https://cdn-icons-png.flaticon.com/512/168/168726.png">

                <div class="bar">
                    <div id="heroHP"></div>
                </div>

                <p>❤️ Hoàng tử</p>
            </div>


            <div class="boss">

                <h3 id="bossName">
                    Boss Typography
                </h3>

                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png">

                <div class="bar">
                    <div id="bossHP"></div>
                </div>

                <p>💀 Quái vật</p>

            </div>

        </div>



        <div id="questionBox">

            <h2 id="question"></h2>

            <div id="answers"></div>

        </div>


        <div id="status">

            <p id="round">
            </p>

            <p id="combo">
            </p>

        </div>


        <div id="effect"></div>


    </div>


    <div id="result" class="hidden">

        <h1 id="resultText"></h1>

        <button onclick="restartGame()">
            🔄 Chơi lại
        </button>

    </div>


</div>


<script src="game.js"></script>

</body>
</html>
